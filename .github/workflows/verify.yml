name: Verify app

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - v0/thai2myanmar-ai-studio
      - fix/deploy-express-backend
      - feat/live-translation-chat

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type-check
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Build container
        run: docker build -t thai2myanmar:ci .
